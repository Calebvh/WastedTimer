services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wastedtimer
      POSTGRES_USER: wastedtimer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastedtimer"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wastedtimer-net

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wastedtimer
      SPRING_DATASOURCE_USERNAME: wastedtimer
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - wastedtimer-net

volumes:
  pgdata:

networks:
  wastedtimer-net:
    driver: bridge
